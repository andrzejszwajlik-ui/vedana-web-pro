name: Import Vedana source

on:
  push:
    paths:
      - ".github/workflows/import-vedana.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/vedana-source.tar.xz.b64.part* | base64 --decode > /tmp/vedana-source.tar.xz
          mkdir -p /tmp/vedana-import
          tar -xJf /tmp/vedana-source.tar.xz -C /tmp/vedana-import
          cp -a /tmp/vedana-import/vedana_scheduler/. .
          rm -rf .import

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import Vedana Scheduler source"
          git push
